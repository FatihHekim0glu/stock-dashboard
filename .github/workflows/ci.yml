name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-pip-

      - name: Install TA-Lib C library from source
        # Ubuntu has no apt package for 0.6.x, so we build it ourselves.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget
          wget https://github.com/ta-lib/ta-lib/releases/download/v0.6.4/ta-lib-0.6.4-src.tar.gz
          tar -xzf ta-lib-0.6.4-src.tar.gz
          cd ta-lib-0.6.4
          ./configure --prefix=/usr
          make
          sudo make install
          echo "TA_INCLUDE_PATH=/usr/include" >> "$GITHUB_ENV"
          echo "TA_LIBRARY_PATH=/usr/lib" >> "$GITHUB_ENV"
          sudo ldconfig

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests (unit + oracle, no network)
        run: pytest -m "not slow"

      - name: Upload pytest cache on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-cache-py${{ matrix.python-version }}
          path: .pytest_cache/
          if-no-files-found: ignore
