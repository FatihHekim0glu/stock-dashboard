name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The project requires Python >= 3.11 (pyproject requires-python), so
        # 3.10 is intentionally not in the matrix.
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install uv
        run: pip install uv

      - name: Install TA-Lib C library from source
        # Ubuntu has no apt package for 0.6.x, so we build it ourselves. The
        # ta-lib Python wheel links against this at install time.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget
          wget https://github.com/ta-lib/ta-lib/releases/download/v0.6.4/ta-lib-0.6.4-src.tar.gz
          tar -xzf ta-lib-0.6.4-src.tar.gz
          cd ta-lib-0.6.4
          ./configure --prefix=/usr
          make
          sudo make install
          echo "TA_INCLUDE_PATH=/usr/include" >> "$GITHUB_ENV"
          echo "TA_LIBRARY_PATH=/usr/lib" >> "$GITHUB_ENV"
          sudo ldconfig

      - name: Sync dependencies
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Type-check with mypy
        run: uv run mypy src

      - name: Run tests with coverage
        run: uv run pytest -m "not slow" --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
